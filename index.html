<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Malhan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#133D24">
<title>Malhan Trading Company</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --subtle:#F7F9F6; --ink:#142019; --ink-2:#38463D; --muted:#66736A;
  --line:#E2E7E0; --line-2:#CDD5CA;
  --brand:#1D6B3B; --brand-h:#175A31; --brand-50:#E7F1E9; --on-brand:#FFFFFF;
  --side:#133D24; --side-ink:#D5E4D8; --side-muted:#8FAE97; --side-hover:#1B4D2F; --side-active:#22603A;
  --accent:#D8A31C; --accent-ink:#8A6300; --accent-50:#FBF2D9;
  --ok:#1D6B3B; --ok-50:#E7F1E9; --warn:#8A6300; --warn-50:#FBF2D9; --bad:#BF3A2F; --bad-50:#FBEAE8; --info:#2A5DA6; --info-50:#E8EEF8;
  --shadow:0 1px 2px rgba(16,28,20,.05),0 1px 1px rgba(16,28,20,.03);
  --shadow-lg:0 18px 48px rgba(12,24,16,.22);
  --r-sm:8px; --r:10px; --r-lg:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#161E19; --subtle:#1A231D; --ink:#E6ECE7; --ink-2:#C3CEC6; --muted:#8D9B91; --line:#26312A; --line-2:#34423A;
  --brand:#4FA66A; --brand-h:#5CB477; --brand-50:#1C3324; --on-brand:#08140C;
  --side:#0B130E; --side-ink:#C9D8CD; --side-muted:#7C9585; --side-hover:#15241A; --side-active:#1C3324;
  --accent:#E3B43E; --accent-ink:#E3B43E; --accent-50:#33290F;
  --ok:#5CB477; --ok-50:#1C3324; --warn:#E3B43E; --warn-50:#33290F; --bad:#F0877C; --bad-50:#3A1F1C; --info:#86AEEA; --info-50:#1B2638;
  --shadow:none; --shadow-lg:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#161E19; --subtle:#1A231D; --ink:#E6ECE7; --ink-2:#C3CEC6; --muted:#8D9B91; --line:#26312A; --line-2:#34423A;
  --brand:#4FA66A; --brand-h:#5CB477; --brand-50:#1C3324; --on-brand:#08140C;
  --side:#0B130E; --side-ink:#C9D8CD; --side-muted:#7C9585; --side-hover:#15241A; --side-active:#1C3324;
  --accent:#E3B43E; --accent-ink:#E3B43E; --accent-50:#33290F;
  --ok:#5CB477; --ok-50:#1C3324; --warn:#E3B43E; --warn-50:#33290F; --bad:#F0877C; --bad-50:#3A1F1C; --info:#86AEEA; --info-50:#1B2638;
  --shadow:none; --shadow-lg:0 18px 48px rgba(0,0,0,.5); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.org{display:flex;gap:11px;align-items:center;padding:4px 8px 20px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#1A1405;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-.02em}
.org b{display:block;font-size:14.5px;line-height:1.2;color:#fff}
.org span{font-size:12.5px;color:var(--side-muted)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .org b{color:var(--ink)}}
.navgroup{margin-bottom:14px}
.navgroup h6{margin:0 0 4px;padding:0 10px;font-size:12px;font-weight:600;color:var(--side-muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500;text-align:left;position:relative}
.nav svg{width:18px;height:18px;opacity:.85}
.nav:hover{background:var(--side-hover)}
.nav[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.me{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;border:0;background:none;color:inherit;width:100%;text-align:left}
.me:hover{background:var(--side-hover)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brand-50);color:var(--brand);flex:none}
.side .avatar{background:var(--side-active);color:#fff}
.me small{display:block;color:var(--side-muted);font-size:12px}

.top{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);min-height:60px}
.crumb{font-size:13px;color:var(--muted)}
.top h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.top .grow{flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);padding:5px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.syncing i{background:var(--info);animation:pulse 1s infinite}
.sync.offline i{background:var(--muted)}
.sync.error i{background:var(--bad)}
.sync.pending i{background:var(--accent)}
@keyframes pulse{50%{opacity:.35}}
.page{padding:22px clamp(16px,3vw,32px) 110px;max-width:1280px}
.mtabs{display:none}

/* ---------- Buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:var(--r-sm);padding:8px 14px;font-weight:600;cursor:pointer;background:var(--brand);color:var(--on-brand);min-height:38px;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{background:var(--brand-h)}
.btn svg{width:16px;height:16px}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2);box-shadow:var(--shadow)}
.btn.sec:hover{background:var(--subtle)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--subtle)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line-2)}
.btn.danger:hover{background:var(--bad-50)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:none;color:var(--muted);padding:6px;border-radius:7px;cursor:pointer;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--subtle);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);min-height:40px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-50)}
input[type=checkbox]{width:auto;min-height:0}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
label.f>small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}

/* ---------- Surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:650}
.card-h .note{color:var(--muted);font-size:13px}
.card-b{padding:16px}
.stack{display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12.5px;margin-top:4px;color:var(--muted)}
.kpi .d b{font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.hero{display:grid;grid-template-columns:1.2fr 2fr;gap:0;overflow:hidden}
.hero-l{padding:18px 20px;background:var(--brand);color:var(--on-brand)}
.hero-l .l{opacity:.85;font-size:13px}
.hero-l .v{font-size:34px;font-weight:750;letter-spacing:-.02em;margin:4px 0 8px;line-height:1.1}
.hero-l .s{display:flex;gap:18px;font-size:13px;opacity:.92;flex-wrap:wrap}
.hero-r{padding:14px 18px 8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--subtle);color:var(--ink-2);border:1px solid var(--line)}
.pill.ok{background:var(--ok-50);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-50);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-50);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-50);color:var(--info);border-color:transparent}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-50);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-weight:500}
.banner.info{background:var(--info-50);border-color:color-mix(in srgb,var(--info) 30%,transparent)}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{position:relative;flex:1;min-width:200px;max-width:360px}
.toolbar .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.toolbar .search input{padding-left:34px}
.toolbar select{width:auto;min-width:130px}
.seg{display:inline-flex;background:var(--subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:600;cursor:pointer;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.summary{display:flex;gap:22px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--subtle);border-radius:var(--r-lg) var(--r-lg) 0 0}
.summary div{font-size:13px;color:var(--muted)}
.summary b{display:block;color:var(--ink);font-size:16px}

/* ---------- Tables ---------- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.t th{position:sticky;top:0;background:var(--subtle);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t th.n,.t td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t tbody tr.click{cursor:pointer}
.t tbody tr.click:hover td{background:var(--subtle)}
.t .primary{font-weight:600}
.only-m{display:none}
.t .sub{color:var(--muted);font-size:12.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t tfoot td{font-weight:700;background:var(--subtle);border-top:1px solid var(--line)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.meter{height:6px;border-radius:9px;background:var(--subtle);border:1px solid var(--line);overflow:hidden;width:110px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--brand)}
.meter i.low{background:var(--accent)} .meter i.out{background:var(--bad)}
.list .row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.list .row .grow{flex:1;min-width:0}
.list .row.click{cursor:pointer}.list .row.click:hover{background:var(--subtle)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}

/* ---------- Menu, dialog, toast ---------- */
.menu{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);padding:6px;min-width:220px}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:500}
.menu button:hover{background:var(--subtle)}
.menu button svg{width:17px;height:17px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu .kbd{margin-left:auto;color:var(--muted);font-size:12px}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:16px;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:var(--shadow-lg)}
dialog.narrow{width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,14,.5)}
.sheet{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.sheet>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font-size:18px;font-weight:700}
.sheet>header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sheet .body{padding:16px 20px;overflow:auto}
.sheet>footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:var(--subtle);border-radius:0 0 16px 16px}
.sheet .total{font-size:20px;font-weight:750}
.sheet .total small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.err{color:var(--bad);font-weight:600;font-size:13.5px;min-height:1px}
.lines{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lines-h,.line{display:grid;grid-template-columns:minmax(0,2fr) 90px 120px 110px 36px;gap:8px;align-items:center;padding:8px 10px}
.lines-h{background:var(--subtle);font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.line{border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.line .hint{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin-top:-2px}
.line .hint.bad{color:var(--bad);font-weight:600}
.line input,.line select{min-height:36px}
.bill{border:1px solid var(--line);border-radius:var(--r);padding:18px}
.bill-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px dashed var(--line-2);padding-bottom:12px;margin-bottom:12px}
.bill-h b{font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

/* ---------- Auth ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-l{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.auth-l h2{font-size:34px;line-height:1.15;color:#fff;margin:0 0 12px;letter-spacing:-.02em;max-width:14ch}
.auth-l p{max-width:40ch;color:var(--side-muted);margin:0}
.auth-r{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(400px,100%)}
.auth-card h3{font-size:22px;margin:0 0 4px}
.auth-card .muted{margin:0 0 20px}
.link{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0}
pre.code{background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font-size:13px}

/* ---------- Mobile ---------- */
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .top-in{padding:10px 16px;min-height:54px}
  .top h1{font-size:18px}
  .crumb{display:none}
  .page{padding:14px 14px 110px}
  .mtabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .mtabs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:8px;cursor:pointer}
  .mtabs button svg{width:22px;height:22px}
  .mtabs button[aria-current="page"]{color:var(--brand)}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:20px}
  .cols{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .toolbar .search{max-width:none;flex-basis:100%}
  .g3{grid-template-columns:1fr 1fr}
  .auth{grid-template-columns:1fr}
  .auth-l{display:none}
  /* tables become cards */
  table.t.stackable thead{display:none}
  table.t.stackable,table.t.stackable tbody,table.t.stackable tr,table.t.stackable td{display:block;width:100%}
  table.t.stackable tr{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
  table.t.stackable td{border:0;padding:2px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  table.t.stackable td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left;font-weight:500}
  table.t.stackable td.lead{display:block;text-align:left;padding-bottom:4px;order:-1}
  table.t.stackable td.lead::before{display:none}
  table.t.stackable td.hide-m{display:none}
  table.t.stackable tfoot{display:block}
  .t .sub{max-width:none;white-space:normal}
  .only-m{display:block}
  .toolbar .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .toolbar .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap}
  table.t.stackable td>span.cell{text-align:right}
  dialog,dialog.narrow{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:94vh}
  .sheet{max-height:94vh}
  .sheet>footer{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .lines-h{display:none}
  .line{grid-template-columns:1fr 1fr 36px;row-gap:6px}
  .line .p{grid-column:1/-1}
  .line .amt{grid-column:1/3;text-align:left}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media print{
  .side,.top,.mtabs,.sheet>header .icon-btn,.sheet>footer,.toast{display:none!important}
  body{background:#fff}

<body>
<div id="root"></div>
<dialog id="dlg"><form class="sheet" id="sheet" method="dialog" novalidate></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
"use strict";
/* =====================================================================
   Malhan Trading Company — shop management
   Offline-first: every change is written to this device first, then
   synced to the shop's Supabase database and pushed live to other devices.
   ===================================================================== */

/* ---------- Utilities ---------- */
const CFG = window.MALHAN_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((+n || 0) * 100) / 100;
const inr = n => "₹" + r2(n).toLocaleString("en-IN", {minimumFractionDigits:0, maximumFractionDigits:2});
const inr0 = n => (n < 0 ? "−₹" : "₹") + Math.round(Math.abs(+n || 0)).toLocaleString("en-IN");
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso, n) => { const [y,m,d] = iso.split("-").map(Number); const x = new Date(Date.UTC(y, m-1, d + n)); return x.toISOString().slice(0,10); };
const monthOf = d => (d || "").slice(0,7);
const prevMonth = m => { const [y,mm] = m.split("-").map(Number); const d = new Date(Date.UTC(y, mm-2, 1)); return d.toISOString().slice(0,7); };
const fmtDate = d => { if(!d) return ""; const [y,m,dd] = d.split("-"); return new Date(+y, +m-1, +dd).toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}); };
const fmtDateShort = d => { if(!d) return ""; const [y,m,dd] = d.split("-"); return new Date(+y, +m-1, +dd).toLocaleDateString("en-IN", {day:"numeric", month:"short"}); };
const fmtMonth = m => { const [y,mm] = m.split("-"); return new Date(+y, +mm-1, 1).toLocaleDateString("en-IN", {month:"long", year:"numeric"}); };
const fmtWhen = t => { if(!t) return ""; const d = new Date(t), s = (Date.now() - d) / 1000;
  if(s < 60) return "just now"; if(s < 3600) return Math.floor(s/60) + " min ago"; if(s < 86400) return Math.floor(s/3600) + " h ago";
  return d.toLocaleDateString("en-IN", {day:"numeric", month:"short"}) + ", " + d.toLocaleTimeString("en-IN", {hour:"numeric", minute:"2-digit"}); };
const byDateDesc = (a,b) => (b.date || "").localeCompare(a.date || "") || String(b._at || "").localeCompare(String(a._at || ""));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const initials = n => (n || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
const billNo = s => "MTC-" + String(s.id).slice(-6).toUpperCase();

function toast(msg, ms = 2600){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms); }

/* ---------- Icons ---------- */
const IC = {
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  sales:'<path d="M5 7h14l-1.3 11.1a2 2 0 0 1-2 1.9H8.3a2 2 0 0 1-2-1.9z"/><path d="M9 7a3 3 0 0 1 6 0"/>',
  purchases:'<path d="M2 17V6h12v11"/><path d="M14 10h4.5L22 13.5V17h-8"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/>',
  stock:'<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
  khata:'<path d="M6 3h11a2 2 0 0 1 2 2v16l-3-1.8-3 1.8-3-1.8L7 21V5a2 2 0 0 1-1-2z"/><path d="M10 8h5M10 12h5"/>',
  expenses:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  products:'<path d="M20 7l-8-4-8 4 8 4z"/><path d="M4 7v10l8 4 8-4V7"/>',
  suppliers:'<path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/>',
  team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  backup:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  more:'<circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  rupee:'<path d="M6 4h12M6 9h12M9 4c6 0 6 10 0 10H6l8 7"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  whatsapp:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  logout:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/>',
  adjust:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'
};
const icon = (k, cls = "") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k] || ""}</svg>`;

/* ---------- State ---------- */
const COLS = ["products","suppliers","purchases","sales","customers","payments","expenses","adjustments"];
const S = {}; COLS.forEach(c => S[c] = []);
const REC = new Map();                       // id -> local record (server shape + dirty/v)
const APP = {
  sb: null, user: null, member: null, shop: null, members: [],
  view: "dashboard", ledger: null,
  sync: { state: "idle", last: 0, error: "" },
  f: { q: "", period: "month", status: "all", khata: "customers", reportMonth: monthOf(today()), expPeriod: "month" }
};
const role = () => APP.member?.role || "staff";
const isOwner = () => role() === "owner";
const isManager = () => role() === "owner" || role() === "manager";
const seesProfit = () => isManager();
const memberName = id => { if(!id) return "—"; if(id === APP.user?.id) return "You"; return APP.members.find(m => m.user_id === id)?.display_name || "Former member"; };
function canChange(x){
  if(isManager()) return true;
  if(!x || x._by !== APP.user?.id) return false;
  return !x._at || (Date.now() - new Date(x._at).getTime()) < 24*3600*1000;
}

/* ---------- Local database (IndexedDB) ---------- */
let idb = null;
const idbName = () => "malhan-" + APP.shop.id + "-" + APP.user.id;
function idbOpen(name){ return new Promise((res, rej) => { const r = indexedDB.open(name, 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("records", {keyPath:"id"}); r.result.createObjectStore("meta"); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function idbAll(){ return new Promise((res, rej) => { const q = idb.transaction("records").objectStore("records").getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
function idbPut(recs){ return new Promise((res, rej) => { if(!recs.length) return res(); const tx = idb.transaction("records", "readwrite"); const st = tx.objectStore("records"); recs.forEach(r => st.put(r)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
function idbDel(ids){ return new Promise((res, rej) => { const tx = idb.transaction("records", "readwrite"); ids.forEach(i => tx.objectStore("records").delete(i)); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
function metaGet(k){ return new Promise(res => { const q = idb.transaction("meta").objectStore("meta").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); }
function metaSet(k, v){ return new Promise(res => { const tx = idb.transaction("meta", "readwrite"); tx.objectStore("meta").put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }

function rebuild(){
  COLS.forEach(c => S[c] = []);
  for(const r of REC.values()){
    if(r.deleted || !S[r.collection]) continue;
    S[r.collection].push({...r.data, id: r.id, _by: r.created_by, _at: r.created_at, _ub: r.updated_by, _uat: r.updated_at, _dirty: !!r.dirty});
  }
}
const pendingCount = () => { let n = 0; for(const r of REC.values()) if(r.dirty) n++; return n; };

async function save(col, data, id){
  id = id || uid();
  const prev = REC.get(id);
  const clean = {}; Object.keys(data).forEach(k => { if(k !== "id" && !k.startsWith("_") && data[k] !== undefined) clean[k] = data[k]; });
  const rec = {
    id, collection: col, data: clean, deleted: false,
    created_by: prev?.created_by || APP.user.id, created_at: prev?.created_at || new Date().toISOString(),
    updated_by: APP.user.id, updated_at: prev?.updated_at || null,
    dirty: 1, v: (prev?.v || 0) + 1
  };
  REC.set(id, rec); await idbPut([rec]); rebuild(); scheduleRender(); schedulePush();
  return id;
}
async function removeRec(id){
  const prev = REC.get(id); if(!prev) return;
  const rec = {...prev, deleted: true, dirty: 1, v: (prev.v || 0) + 1, updated_by: APP.user.id};
  REC.set(id, rec); await idbPut([rec]); rebuild(); scheduleRender(); schedulePush();
}

/* ---------- Sync engine ---------- */
let pushing = false, pushAgain = false, pushTimer = null, pulling = false, channel = null;
const online = () => navigator.onLine !== false;
function setSync(state, error = ""){ APP.sync.state = state; APP.sync.error = error; if(state === "ok") APP.sync.last = Date.now(); drawSync(); }
function schedulePush(){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 400); drawSync(); }
const isPermErr = e => e && (e.code === "42501" || /row-level security|permission denied/i.test(e.message || ""));

async function push(){
  if(!APP.sb || !APP.shop || !online()) { drawSync(); return; }
  if(pushing){ pushAgain = true; return; }
  const dirty = [...REC.values()].filter(r => r.dirty);
  if(!dirty.length){ if(APP.sync.state !== "error") setSync("ok"); return; }
  pushing = true; setSync("syncing");
  try{
    for(let i = 0; i < dirty.length; i += 200){
      const batch = dirty.slice(i, i + 200);
      const sentV = new Map(batch.map(r => [r.id, r.v]));
      const { data, error } = await APP.sb.from("records")
        .upsert(batch.map(r => ({shop_id: APP.shop.id, id: r.id, collection: r.collection, data: r.data, deleted: !!r.deleted})), {onConflict: "shop_id,id"})
        .select();
      if(error){ if(isPermErr(error)) await pushOneByOne(batch); else throw error; continue; }
      await acceptServerRows(data || [], sentV);
    }
    setSync("ok");
  }catch(e){ console.warn("push failed", e); setSync("error", e.message || "Sync failed"); }
  finally{ pushing = false; rebuild(); scheduleRender(); if(pushAgain){ pushAgain = false; push(); } }
}
async function acceptServerRows(rows, sentV){
  const out = [];
  for(const row of rows){
    const local = REC.get(row.id);
    if(local && sentV && local.v !== sentV.get(row.id)){
      Object.assign(local, {created_by: row.created_by, created_at: row.created_at, updated_at: row.updated_at}); out.push(local);
    } else { const rec = {...row, dirty: 0, v: local?.v || 0}; delete rec.shop_id; REC.set(row.id, rec); out.push(rec); }
  }
  await idbPut(out);
}
async function pushOneByOne(batch){
  let rejected = 0;
  for(const r of batch){
    const v = r.v;
    const { data, error } = await APP.sb.from("records")
      .upsert({shop_id: APP.shop.id, id: r.id, collection: r.collection, data: r.data, deleted: !!r.deleted}, {onConflict: "shop_id,id"}).select();
    if(!error){ await acceptServerRows(data || [], new Map([[r.id, v]])); continue; }
    if(!isPermErr(error)) throw error;
    rejected++;
    const { data: srv } = await APP.sb.from("records").select("*").eq("shop_id", APP.shop.id).eq("id", r.id).maybeSingle();
    if(srv){ const rec = {...srv, dirty: 0, v: 0}; delete rec.shop_id; REC.set(r.id, rec); await idbPut([rec]); }
    else { REC.delete(r.id); await idbDel([r.id]); }
  }
  if(rejected) toast(`${rejected} change${rejected > 1 ? "s were" : " was"} not allowed for your role and ${rejected > 1 ? "were" : "was"} undone.`, 5000);
}
async function pull(){
  if(!APP.sb || !APP.shop || !online() || pulling) return;
  pulling = true;
  try{
    let cursor = await metaGet("cursor");
    let since = cursor ? new Date(new Date(cursor).getTime() - 120000).toISOString() : "1970-01-01T00:00:00Z";
    for(let guard = 0; guard < 200; guard++){
      const { data, error } = await APP.sb.from("records").select("*").eq("shop_id", APP.shop.id)
        .gt("updated_at", since).order("updated_at", {ascending: true}).limit(1000);
      if(error) throw error;
      await applyRemote(data || []);
      if(data && data.length){ since = data[data.length - 1].updated_at; if(!cursor || new Date(since) > new Date(cursor)) cursor = since; }
      if(!data || data.length < 1000) break;
    }
    if(cursor) await metaSet("cursor", cursor);
    if(!pendingCount()) setSync("ok");
  }catch(e){ console.warn("pull failed", e); setSync("error", e.message || "Sync failed"); }
  finally{ pulling = false; }
}
async function applyRemote(rows){
  const out = [];
  for(const row of rows){
    const local = REC.get(row.id);
    if(local && local.dirty) continue;
    if(local && local.updated_at && new Date(local.updated_at) >= new Date(row.updated_at)) continue;
    const rec = {...row, dirty: 0, v: local?.v || 0}; delete rec.shop_id;
    REC.set(row.id, rec); out.push(rec);
  }
  if(out.length){ await idbPut(out); rebuild(); scheduleRender();
    if(out.some(r => (r.created_by && !APP.members.some(m => m.user_id === r.created_by)) || (r.updated_by && !APP.members.some(m => m.user_id === r.updated_by)))) refreshMembersSoon(); }
}
let membersAt = 0, unknownAt = 0;
function refreshMembersSoon(){ if(Date.now() - unknownAt < 15000) return; unknownAt = Date.now(); loadMembers(); }
function startRealtime(){
  if(channel) APP.sb.removeChannel(channel);
  channel = APP.sb.channel("records-" + APP.shop.id)
    .on("postgres_changes", {event: "*", schema: "public", table: "records", filter: "shop_id=eq." + APP.shop.id},
        p => { if(p.new && p.new.id) applyRemote([p.new]); })
    .subscribe();
}
async function syncNow(){ await push(); await pull(); if(Date.now() - membersAt > 300000){ membersAt = Date.now(); loadMembers(); } }
async function loadMembers(){
  if(!online()) return;
  const { data } = await APP.sb.from("members").select("*").eq("shop_id", APP.shop.id).order("joined_at");
  if(data){ APP.members = data; await metaSet("members", data);
    const mine = data.find(m => m.user_id === APP.user.id);
    if(mine && !mine.active){ alert("Your access to this shop has been removed."); await signOut(true); return; }
    if(mine){ APP.member = {...APP.member, ...mine}; cacheMembership(); }
    scheduleRender(); }
}
window.addEventListener("online", () => { drawSync(); syncNow(); loadMembers(); });
window.addEventListener("offline", drawSync);
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && APP.shop) syncNow(); });
setInterval(() => { if(APP.shop && document.visibilityState === "visible") syncNow(); }, 60000);

/* ---------- Calculations ---------- */
const P = id => S.products.find(p => p.id === id);
const pname = id => P(id)?.name || "Unknown product";
const supName = id => S.suppliers.find(s => s.id === id)?.name || "Unknown supplier";
const cust = id => S.customers.find(c => c.id === id);
const custName = id => cust(id)?.name || "";
const saleWho = s => s.customerId ? (custName(s.customerId) || "Unknown customer") : "Walk-in customer";
const itemsQty = items => (items || []).reduce((a, i) => a + num(i.qty), 0);
const purSub = p => (p.items || []).reduce((a, i) => a + num(i.qty) * num(i.rate), 0);
const purTotal = p => purSub(p) + num(p.freight) + num(p.other);
const saleSub = s => (s.items || []).reduce((a, i) => a + num(i.qty) * num(i.rate), 0);
const saleTotal = s => saleSub(s) - num(s.discount);
const saleCost = s => (s.items || []).reduce((a, i) => a + num(i.qty) * num(i.cost), 0);
const saleProfit = s => saleTotal(s) - saleCost(s);
const saleDue = s => saleTotal(s) - num(s.paid);
const purDue = p => purTotal(p) - num(p.paid);
const itemsText = items => (items || []).map(i => `${num(i.qty)} × ${pname(i.productId)}`).join(", ");
function landedUnit(p, item){ const q = itemsQty(p.items); return num(item.rate) + (q ? (num(p.freight) + num(p.other)) / q : 0); }
function avgCost(pid){ let q = 0, v = 0;
  S.purchases.forEach(p => (p.items || []).forEach(i => { if(i.productId === pid){ q += num(i.qty); v += num(i.qty) * landedUnit(p, i); } }));
  return q ? v / q : 0; }
function stockOf(pid){ let q = 0;
  S.purchases.forEach(p => (p.items || []).forEach(i => { if(i.productId === pid) q += num(i.qty); }));
  S.sales.forEach(s => (s.items || []).forEach(i => { if(i.productId === pid) q -= num(i.qty); }));
  S.adjustments.forEach(a => { if(a.productId === pid) q += num(a.qty); });
  return q; }
function lastRate(pid, kind){ for(const x of [...S[kind]].sort(byDateDesc)){ const it = (x.items || []).find(i => i.productId === pid); if(it) return num(it.rate); } return 0; }
function custBalance(cid){ let b = 0;
  S.sales.forEach(s => { if(s.customerId === cid) b += saleDue(s); });
  S.payments.forEach(p => { if(p.kind === "customer" && p.partyId === cid) b -= num(p.amount); });
  return b; }
function supBalance(sid){ let b = 0;
  S.purchases.forEach(p => { if(p.supplierId === sid) b += purDue(p); });
  S.payments.forEach(p => { if(p.kind === "supplier" && p.partyId === sid) b -= num(p.amount); });
  return b; }
function lastActivity(kind, id){
  const dates = kind === "c" ? [...S.sales.filter(s => s.customerId === id), ...S.payments.filter(p => p.kind === "customer" && p.partyId === id)].map(x => x.date)
                             : [...S.purchases.filter(p => p.supplierId === id), ...S.payments.filter(p => p.kind === "supplier" && p.partyId === id)].map(x => x.date);
  return dates.sort().pop() || ""; }
function periodRange(key){
  const t = today(), m = monthOf(t);
  if(key === "today") return [t, t];
  if(key === "7d") return [addDays(t, -6), t];
  if(key === "month") return [m + "-01", t];
  if(key === "last"){ const pm = prevMonth(m); return [pm + "-01", pm + "-31"]; }
  return ["0000-01-01", "9999-12-31"];
}
const inRange = (d, [a, b]) => d >= a && d <= b;
function monthFigures(m){
  const sales = S.sales.filter(s => monthOf(s.date) === m), exp = S.expenses.filter(e => monthOf(e.date) === m);
  const revenue = sales.reduce((a, s) => a + saleTotal(s), 0), cost = sales.reduce((a, s) => a + saleCost(s), 0);
  const expenses = exp.reduce((a, e) => a + num(e.amount), 0);
  const bought = S.purchases.filter(p => monthOf(p.date) === m).reduce((a, p) => a + purTotal(p), 0);
  const bags = sales.reduce((a, s) => a + itemsQty(s.items), 0);
  return {sales, exp, revenue, cost, gross: revenue - cost, expenses, net: revenue - cost - expenses, bought, bags};
}
function delta(cur, prev){ if(!prev) return ""; const d = (cur - prev) / Math.abs(prev) * 100; return `<b class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${Math.abs(d).toFixed(0)}%</b> vs last month`; }

/* ---------- Rendering ---------- */
let renderQueued = false;
function scheduleRender(){ if(renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
const NAV = [
  ["Overview", [["dashboard","Dashboard"],["activity","Activity", () => isManager()]]],
  ["Operations", [["sales","Sales"],["purchases","Purchases"],["stock","Stock"],["khata","Khata"]]],
  ["Finance", [["expenses","Expenses"],["reports","Reports", () => seesProfit()]]],
  ["Setup", [["products","Products"],["suppliers","Suppliers"],["team","Team"],["backup","Backup & export"]]]
];
const TITLES = {dashboard:"Dashboard", activity:"Activity", sales:"Sales", purchases:"Purchases", stock:"Stock", khata:"Khata", expenses:"Expenses", reports:"Reports", products:"Products", suppliers:"Suppliers", team:"Team", backup:"Backup & export", more:"More"};
const SECTION = v => (NAV.find(([, items]) => items.some(([k]) => k === v)) || ["Overview"])[0];
function go(v){ APP.view = v; APP.f.q = ""; render(); window.scrollTo(0, 0); }

function render(){
  if(!APP.shop) return;
  const ae = document.activeElement, focusId = ae && ae.id && ae.closest && ae.closest("#root") ? ae.id : null;
  const selStart = focusId && ae.selectionStart;

function drawSync(){

/* ---------- Charts ---------- */
function barChart(values, labels, {h = 150, w = 600, color = "var(--brand)", fmt = inr0, highlightLast = true} = {}){
  const pad = 22, n = values.length, max = Math.max(1, ...values), bw = (w - pad) / n;
  const bars = values.map((v, i) => { const bh = Math.max(v > 0 ? 2 : 0, (v / max) * (h - 30)); const x = pad + i * bw + bw * .15, y = h - 18 - bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * .7).toFixed(1)}" height="${bh.toFixed(1)}" rx="2.5" fill="${color}" opacity="${highlightLast && i === n - 1 ? 1 : .72}"><title>${esc(labels[i])}: ${fmt(v)}</title></rect>`; }).join("");
  const every = Math.ceil(n / 8);
  const lbl = labels.map((l, i) => ((i % every === 0 && (n - 1 - i >= every || i === n - 1)) || i === n - 1) ? `<text x="${(pad + i * bw + bw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle">${esc(l)}</text>` : "").join("");
  const grid = [0.5, 1].map(f => `<line x1="${pad}" x2="${w}" y1="${(h - 18 - f * (h - 30)).toFixed(1)}" y2="${(h - 18 - f * (h - 30)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="${(h - 14 - f * (h - 30)).toFixed(1)}">${f === 1 ? shortAmt(max) : shortAmt(max / 2)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Bar chart">${grid}${bars}${lbl}</svg>`;
}
const shortAmt = v => v >= 1e7 ? (v / 1e7).toFixed(1) + "Cr" : v >= 1e5 ? (v / 1e5).toFixed(1) + "L" : v >= 1e4 ? (v / 1e3).toFixed(0) + "k" : v >= 1e3 ? (v / 1e3).toFixed(1) + "k" : Math.round(v) + "";

V.reports = () => {
  if(!seesProfit()) return emptyState("Reports are for owners and managers", "Ask the owner if you need access.", "");
  const months = [...new Set([monthOf(today()), ...S.sales.map(s => monthOf(s.date)), ...S.expenses.map(e => monthOf(e.date)), ...S.purchases.map(p => monthOf(p.date))])].filter(Boolean).sort().reverse();
  const m = APP.f.reportMonth, f = monthFigures(m), pf = monthFigures(prevMonth(m));
  const rows = {};
  f.sales.forEach(s => { const sub = saleSub(s) || 1; (s.items || []).forEach(i => { const r = rows[i.productId] || (rows[i.productId] = {q: 0, rev: 0, cost: 0}); const line = num(i.qty) * num(i.rate);
    r.q += num(i.qty); r.rev += line - num(s.discount) * line / sub; r.cost += num(i.qty) * num(i.cost); }); });
  const pr = Object.entries(rows).sort((a, b) => b[1].rev - a[1].rev);
  const last12 = [...Array(12)].map((_, i) => { let x = m; for(let k = 0; k < 11 - i; k++) x = prevMonth(x); return x; });
  const rev12 = last12.map(x => monthFigures(x).revenue), net12 = last12.map(x => monthFigures(x).net);
  const cats = {}; f.exp.forEach(e => cats[e.category] = (cats[e.category] || 0) + num(e.amount));
  const kpi = (l, v, d, cls = "") => `<div class="card kpi"><div class="l">${l}</div><div class="v num ${cls}">${v}</div><div class="d">${d || "&nbsp;"}</div></div>`;
  return `<div class="toolbar"><select id="rmonth" data-f="reportMonth" style="width:auto">${months.map(x => `<option value="${x}" ${x === m ? "selected" : ""}>${fmtMonth(x)}</option>`).join("")}</select>

  <div class="stack">
    <div class="kpis">${kpi("Sales", inr0(f.revenue), delta(f.revenue, pf.revenue))}${kpi("Cost of goods sold", inr0(f.cost), `Gross margin ${f.revenue ? (f.gross / f.revenue * 100).toFixed(1) : 0}%`)}${kpi("Expenses", inr0(f.expenses), delta(f.expenses, pf.expenses))}${kpi("Net profit", inr0(f.net), delta(f.net, pf.net), f.net < 0 ? "down" : "")}</div>
    <section class="card"><div class="card-h"><h3>Last 12 months</h3><span class="note">Sales (bars)</span></div><div class="card-b">${barChart(rev12, last12.map(x => fmtMonth(x).slice(0, 3)), {h: 190, w: 1000})}
      <div class="tw" style="margin-top:8px"><table class="t"><thead><tr><th>Month</th>${last12.slice(-6).map(x => `<th class="n">${fmtMonth(x).slice(0, 3)}</th>`).join("")}</tr></thead><tbody>
      <tr><td>Sales</td>${rev12.slice(-6).map(v => `<td class="n">${shortAmt(v)}</td>`).join("")}</tr><tr><td>Net profit</td>${net12.slice(-6).map(v => `<td class="n ${v < 0 ? "down" : ""}">${shortAmt(Math.abs(v)) === "0" ? "0" : (v < 0 ? "−" : "") + shortAmt(Math.abs(v))}</td>`).join("")}</tr></tbody></table></div></div></section>
    <div class="cols">
      <section class="card"><div class="card-h"><h3>Product performance</h3><span class="note">${fmtMonth(m)}</span></div>
        <div class="tw"><table class="t stackable"><thead><tr><th>Product</th><th class="n">Bags</th><th class="n">Sales</th><th class="n">Cost</th><th class="n">Profit</th><th class="n">Per bag</th></tr></thead><tbody>
        ${pr.length ? pr.map(([pid, r]) => `<tr><td class="lead"><span class="primary">${esc(pname(pid))}</span></td><td class="n" data-l="Bags">${r.q}</td><td class="n" data-l="Sales">${inr0(r.rev)}</td><td class="n" data-l="Cost">${inr0(r.cost)}</td><td class="n" data-l="Profit"><span class="${r.rev - r.cost < 0 ? "down" : ""}">${inr0(r.rev - r.cost)}</span></td><td class="n" data-l="Per bag">${r.q ? inr((r.rev - r.cost) / r.q) : "—"}</td></tr>`).join("") : `<tr><td colspan="6" class="empty">No sales this month</td></tr>`}
        </tbody>${pr.length ? `<tfoot><tr><td>Total</td><td class="n">${f.bags}</td><td class="n">${inr0(f.revenue)}</td><td class="n">${inr0(f.cost)}</td><td class="n">${inr0(f.gross)}</td><td></td></tr></tfoot>` : ""}</table></div></section>
      <section class="card"><div class="card-h"><h3>Profit &amp; loss</h3><span class="note">${fmtMonth(m)}</span></div><div class="list">
        <div class="row"><div class="grow">Sales</div><b class="num">${inr0(f.revenue)}</b></div>

V.activity = () => {

  if(AUDIT === "offline") return `<section class="card">${emptyState("You're offline", "The activity log needs an internet connection.", `<button class="btn sec" data-act="reloadAudit">Try again</button>`)}</section>`;
  const labels = {create: ["Created", "ok"], update: ["Edited", "info"], delete: ["Deleted", "bad"], restore: ["Restored", "info"]};
  return `<div class="toolbar"><span class="muted small">Last 200 changes by everyone in the shop</span><span style="flex:1"></span><button class="btn sec" data-act="reloadAudit">${icon("refresh")}Refresh</button></div>
  <section class="card">${AUDIT.length ? `<div class="tw"><table class="t stackable"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Record</th><th>Details</th></tr></thead><tbody>
  ${AUDIT.map(a => { const [l, c] = labels[a.action] || [a.action, ""]; const d = a.new_data || a.old_data || {};
    return `<tr><td data-l="When">${fmtWhen(a.at)}</td><td class="lead"><span class="primary">${esc(memberName(a.actor))}</span></td><td data-l="Action"><span class="pill ${c}">${l}</span></td><td data-l="Record">${esc(cap(a.collection.replace(/s$/, "")))}</td><td data-l="Details"><div class="sub">${esc(describe(a.collection, d, a.old_data))}</div></td></tr>`; }).join("")}
  </tbody></table></div>` : emptyState("No activity yet", "", "")}</section>`;
};
async function loadAudit(){
  if(!online()){ AUDIT = "offline"; scheduleRender(); return; }
  const { data, error } = await APP.sb.from("audit_log").select("*").eq("shop_id", APP.shop.id).order("at", {ascending: false}).limit(200);
  AUDIT = error ? [] : data; scheduleRender();
}
function describe(col, d, old){
  try{
    if(col === "sales") return `${d.customerId ? custName(d.customerId) || "Customer" : "Walk-in"} · ${itemsText(d.items)} · ${inr0(saleTotal(d))}` + (old && saleTotal(old) !== saleTotal(d) ? ` (was ${inr0(saleTotal(old))})` : "");
    if(col === "purchases") return `${supName(d.supplierId)} · ${itemsText(d.items)} · ${inr0(purTotal(d))}`;
    if(col === "payments") return `${d.kind === "customer" ? "From " + custName(d.partyId) : "To " + supName(d.partyId)} · ${inr0(d.amount)} ${d.mode || ""}`;
    if(col === "expenses") return `${d.category} · ${inr0(d.amount)}`;
    if(col === "adjustments") return `${pname(d.productId)} · ${num(d.qty) > 0 ? "+" : ""}${num(d.qty)} bags · ${d.reason || ""}`;
    if(col === "products") return `${d.name}${old && old.mrp !== d.mrp ? ` · MRP ${inr(old.mrp || 0)} → ${inr(d.mrp || 0)}` : ""}`;
    return d.name || "";
  }catch(e){ return ""; }
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const n = e.target.closest("[data-nav]"); if(n){ closeMenu(); go(n.dataset.nav); return; }
  const a = e.target.closest("[data-act]"); if(a && ACT[a.dataset.act]){ if(a.tagName === "SELECT") return; e.preventDefault(); ACT[a.dataset.act](a.dataset.id, a, e); return; }
  if(!e.target.closest(".menu")) closeMenu();
});
document.addEventListener("input", e => {
  const k = e.target.dataset && e.target.dataset.f; if(!k || !e.target.closest("#root")) return;
  APP.f[k] = e.target.value; render();
});
document.addEventListener("change", e => {
  if(e.target.id === "importFile"){ importFrom(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape") closeMenu();
  if(dlgEl.open || /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName || "") || e.metaKey || e.ctrlKey || e.altKey || !APP.shop) return;
  if(e.key === "s"){ e.preventDefault(); ACT.newSale(); } if(e.key === "p"){ e.preventDefault(); ACT.newPurchase(); } if(e.key === "/"){ const q = $("#q"); if(q){ e.preventDefault(); q.focus(); } }
});

let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
function openMenu(anchor, html){
  closeMenu(); menuEl = document.createElement("div"); menuEl.className = "menu"; menuEl.innerHTML = html; document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect(), mw = menuEl.offsetWidth, mh = menuEl.offsetHeight;
  let left = Math.min(window.innerWidth - mw - 8, Math.max(8, r.right - mw)), top = r.bottom + 6;
  if(top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 6);
  if(r.left < 260 && r.top > window.innerHeight / 2) left = Math.max(8, r.left);
  menuEl.style.left = left + "px"; menuEl.style.top = top + "px";
  menuEl.querySelector("button")?.focus();
}

  sheet.onsubmit = async e => { e.preventDefault(); const btn = sheet.querySelector("[type=submit]"); $("#ferr").textContent = "";
    try{ if(btn) btn.disabled = true; const ok = onSubmit ? await onSubmit(new FormData(sheet)) : true; if(ok !== false) dlgEl.close(); }
    catch(err){ $("#ferr").textContent = err.message || "Could not save"; } finally{ if(btn) btn.disabled = false; } };
  sheet.oninput = onInput || null; sheet.onchange = onInput || null;
  if(!dlgEl.open) dlgEl.showModal();

function toCsv(rows){ return "\ufeff" + rows.map(r => r.map(v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); }
function salesCsv(list){
  const rows = [["Date","Bill","Customer","Village","Product","Bags","Rate","Line amount","Bill discount","Bill total","Bill paid","Mode","Entered by", ...(seesProfit() ? ["Cost per bag","Line profit"] : [])]];
  [...list].sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(s => (s.items || []).forEach((i, k) => rows.push([s.date, billNo(s), saleWho(s), cust(s.customerId)?.village || "", pname(i.productId), i.qty, i.rate, r2(num(i.qty) * num(i.rate)), k ? "" : num(s.discount), k ? "" : r2(saleTotal(s)), k ? "" : num(s.paid), k ? "" : s.mode, memberName(s._by), ...(seesProfit() ? [i.cost, r2(num(i.qty) * (num(i.rate) - num(i.cost)))] : [])])));
  return toCsv(rows);
}
async function download(filename, text, type = "text/csv;charset=utf-8"){
  const blob = new Blob([text], {type});
  try{ const file = new File([blob], filename, {type});
    if(navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){ await navigator.share({files: [file], title: filename}); return; } }
  catch(e){ if(e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function importFrom(file){
  if(!file) return;
  let data; try{ data = JSON.parse(await file.text()); }catch(e){ return alert("That file isn't a valid backup."); }
  const cols = COLS.filter(c => Array.isArray(data[c]));
  const total = cols.reduce((a, c) => a + data[c].length, 0);
  if(!total) return alert("No records found in that file.");
  if(!confirm(`Import ${total} records into ${APP.shop.name}? Records already in the shop with the same ID will be overwritten by the file's version.`)) return;
  const recs = [];
  cols.forEach(c => data[c].forEach(r => { if(!r || !r.id) return; const {id, createdAt, ...rest} = r; const prev = REC.get(id);
    recs.push({id, collection: c, data: rest, deleted: false, created_by: prev?.created_by || APP.user.id, created_at: prev?.created_at || new Date().toISOString(), updated_by: APP.user.id, updated_at: prev?.updated_at || null, dirty: 1, v: (prev?.v || 0) + 1}); }));
  recs.forEach(r => REC.set(r.id, r)); await idbPut(recs); rebuild(); render(); schedulePush();
  toast(`Imported ${recs.length} records · syncing`, 4000);
}

}
const memberCacheKey = () => "malhan-member-" + APP.user.id;
function cacheMembership(){ try{ localStorage.setItem(memberCacheKey(), JSON.stringify({member: APP.member, shop: APP.shop})); }catch(e){} }
async function afterAuth(){
  const { data: { session } } = await APP.sb.auth.getSession();
  if(!session){ showSignIn(); return; }
  APP.user = session.user;
  let found = null;
  if(online()){
    const { data, error } = await APP.sb.from("members").select("*, shops(id, name, join_code)").eq("user_id", APP.user.id).eq("active", true).limit(1);
    if(!error && data && data.length){ const m = data[0]; found = {member: {shop_id: m.shop_id, user_id: m.user_id, role: m.role, display_name: m.display_name, email: m.email, active: m.active}, shop: m.shops}; }
    else if(!error){ const cached = localStorage.getItem(memberCacheKey()); if(cached) localStorage.removeItem(memberCacheKey()); showOnboarding(); return; }
  }
  if(!found){ try{ found = JSON.parse(localStorage.getItem(memberCacheKey()) || "null"); }catch(e){} }
  if(!found){ showOnboarding(online() ? "" : "You're offline. Connect to the internet to join your shop."); return; }
  APP.member = found.member; APP.shop = found.shop; cacheMembership();
  await openShop();
}
async function openShop(){
  idb = await idbOpen(idbName());
  (await idbAll()).forEach(r => REC.set(r.id, r));
  APP.members = (await metaGet("members")) || [APP.member];
  rebuild();
  APP.view = "dashboard";
  render();
  if(navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  await loadMembers();
  await syncNow();
  if(APP.firstRun && isOwner() && !S.products.length && !S.suppliers.length) await seedDefaults();
  startRealtime();
}
async function seedDefaults(){
  const prods = [["Urea",45,20],["DAP",50,20],["SSP",50,20],["TSP",50,10],["Sulphur",0,10],["Ammonium sulphate",50,10]];
  for(const [name, bagKg, lowStock] of prods) await save("products", {name, category: "Fertilizer", bagKg, mrp: 0, lowStock, active: true});
  await save("suppliers", {name: "NFL", type: "Company dealership", phone: "", products: "Urea, DAP, SSP, TSP, Sulphur, Ammonium sulphate"});
  await save("suppliers", {name: "Seed market", type: "Market / wholesaler", phone: "", products: "Seeds"});
  toast("Shop created with your products and suppliers. Set MRPs under Products.", 5000);
}
async function signOut(force = false){
  closeMenu();
  const n = APP.shop ? pendingCount() : 0;
  if(!force && n && !confirm(`${n} change${n > 1 ? "s haven't" : " hasn't"} synced yet and will be lost if you sign out now. Sign out anyway?`)) return;
  if(!force && !n && !confirm("Sign out? Shop data will be removed from this device (it stays safe in the shop's database).")) return;
  try{ if(channel) APP.sb.removeChannel(channel); }catch(e){}
  if(idb){ const name = idb.name; idb.close(); idb = null; indexedDB.deleteDatabase(name); }
  if(APP.user) localStorage.removeItem(memberCacheKey());
  REC.clear(); rebuild(); APP.shop = null; APP.member = null; APP.members = []; AUDIT = null;
  try{ await APP.sb.auth.signOut(); }catch(e){}
  showSignIn();
}

/* ---------- Boot ---------- */
(async function boot(){
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ showSetupNeeded(); return; }
  APP.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true}});
  APP.sb.auth.onAuthStateChange((event) => { if(event === "PASSWORD_RECOVERY") setTimeout(showNewPassword, 0); });
  $("#root").innerHTML = `<div class="empty" style="padding-top:30vh">Loading…</div>`;
  try{ await afterAuth(); }catch(e){ console.error(e); showSignIn("signin", online() ? "Couldn't connect. Please try again." : "You're offline."); }
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
